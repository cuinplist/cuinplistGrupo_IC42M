<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de servicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #b8a5cb;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #b656bd;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Cual es mi nimbre ?</h1>
    <button onclick="ejecuta()">click</button>
    <script>
        async function ejecuta() {
            try {
                const resp = await fetch("index.php");
                if (resp.ok) {
                    const texto = await resp.text();
                    alert(texto);
                } else {
                    throw new Error(resp.statusText);
                }
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }
    </script>
</body>

</html>
